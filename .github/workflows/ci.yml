name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bootstrap venv and dev deps
        run: python scripts/dev.py setup
      - name: Tests
        run: python scripts/dev.py test
      - name: Lint
        run: python scripts/dev.py lint
