[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workpull"
version = "0.1.0"
description = "a backend-agnostic, pluggable pull system. Pull work, claim it, finish it, then pull again."
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["workpull*"]
