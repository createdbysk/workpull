[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workpull"
version = "0.1.0"
description = "a backend-agnostic, pluggable pull system. Only describe is available so far."
license = {text = "Apache-2.0"}
requires-python = ">=3.12,<3.13"
dependencies = ["click>=8.1,<9"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=7,<8", "pymarkdownlnt>=0.9.41", "pyrefly>=1.4,<2", "ruff>=0.17.4,<0.18", "black>=26.10.1,<27"]

[tool.setuptools.packages.find]
include = ["workpull*"]

# Preview is on because E302, E303, and W391 only take effect
# as preview rules in Ruff 0.17; the select list keeps every
# other rule, stable or preview, out of the lint.
[tool.ruff]
preview = true

[tool.ruff.lint]
select = ["E302", "E303", "W391", "W292"]
